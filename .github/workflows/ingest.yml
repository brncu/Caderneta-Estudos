name: Ingestão de Questões

# Roda quando você adiciona/altera algum arquivo em questions_batch/,
# manualmente (aba Actions > Run workflow), ou toda segunda-feira às
# 06:00 UTC (03:00 em Brasília), como uma sincronização periódica.
on:
  push:
    paths:
      - "questions_batch/**"
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar ingestão de questões
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest_questions.py
